name: Build Memory Game

on:
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write

jobs:

  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build Windows executable
        run: pyinstaller --onefile --name MemoryGame memory_game.py

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: MemoryGame-Windows
          path: dist/MemoryGame.exe


  build-macos:
    name: Build macOS
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build macOS executable
        run: pyinstaller --onefile --name MemoryGame memory_game.py

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: MemoryGame-macOS
          path: dist/MemoryGame


  build-linux:
    name: Build Ubuntu/Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build Linux executable
        run: pyinstaller --onefile --name MemoryGame memory_game.py

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: MemoryGame-Linux
          path: dist/MemoryGame


  release:
    name: Attach Downloads to Release
    runs-on: ubuntu-latest
    needs:
      - build-windows
      - build-macos
      - build-linux

    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: MemoryGame-Windows
          path: windows

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: MemoryGame-macOS
          path: macos

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: MemoryGame-Linux
          path: linux

      - name: Prepare release files
        run: |
          mkdir release

          cp windows/MemoryGame.exe release/MemoryGame-Windows.exe
          cp macos/MemoryGame release/MemoryGame-macOS
          cp linux/MemoryGame release/MemoryGame-Linux

          chmod +x release/MemoryGame-macOS
          chmod +x release/MemoryGame-Linux

      - name: Upload files to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            release/MemoryGame-Windows.exe \
            release/MemoryGame-macOS \
            release/MemoryGame-Linux \
            --repo "${{ github.repository }}" \
            --clobber